<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Form Quickfill</title>
<style>
  :root { --ink: #111; --muted: #666; --line: #e5e5e5; --bg: #fff; --soft: #f4f4f5; --green: #15803d; --purple: #7c3aed; --amber: #b45309; --red: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --ink: #eee; --muted: #9a9a9a; --line: #333; --bg: #18181b; --soft: #27272a; --green: #4ade80; --purple: #a78bfa; --amber: #fbbf24; --red: #f87171; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; font: 13px/1.45 -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
  h1 small { font-weight: 400; color: var(--muted); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  label { display: block; font-size: 11px; color: var(--muted); margin-top: 6px; }
  input, select { width: 100%; font: inherit; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  .evidence { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .url { font-size: 11px; color: var(--muted); word-break: break-all; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  button { flex: 1; font: inherit; padding: 7px 6px; border: 0; border-radius: 6px; background: var(--soft); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--ink); color: var(--bg); font-weight: 600; }
  button.go { background: var(--green); color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .skiprow select { flex: 1.3; }
  #notes div { margin-top: 4px; }
  .ask { margin-top: 8px; padding: 8px; border-radius: 6px; background: var(--soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { flex: none; max-width: 100%; text-align: left; padding: 4px 8px; font-size: 12px; border: 1px solid var(--line); background: var(--bg); }
  .chip b { font-weight: 600; margin-right: 4px; }
  .chip span { color: var(--muted); }
  .learned div { display: flex; justify-content: space-between; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .learned button { flex: none; padding: 0 6px; background: none; color: var(--muted); }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>Form Quickfill <small id="left"></small></h1>

  <label>Agency</label><input id="agency">
  <label>Founder first name (blank = "Hey there!")</label><input id="first">
  <div class="evidence" id="evidence"></div>
  <div class="url" id="url"></div>

  <div class="row"><button class="primary" id="next">Next lead</button><button id="fill">Fill this page</button></div>
  <div class="row"><button id="email">Open email instead</button></div>
  <div class="evidence" id="mailfrom"></div>
  <div class="row"><button id="remember">Remember this</button><button id="sent">Mark sent</button></div>
  <div class="row skiprow">
    <select id="reason">
      <option>phone required</option><option>popup or hidden form</option><option>CAPTCHA</option>
      <option>budget required</option><option>multi-step form</option><option>no message box</option>
      <option>not a fit anymore</option><option>site down</option><option>other</option>
    </select>
    <button id="skip">Skip</button>
  </div>

  <div id="notes"></div>
  <div class="ask hidden" id="ask">Did it send?
    <div class="row"><button class="go" id="askyes">Yes, log it</button><button id="askno">No</button></div>
  </div>

  <h2>Copy</h2>
  <div class="chips" id="chips"></div>
  <h2>agy's answers on this form</h2>
  <div class="chips" id="answers"><span class="evidence">None yet.</span></div>
  <h2>Learned from you</h2>
  <div class="learned" id="learned"></div>

  <script src="templates.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
